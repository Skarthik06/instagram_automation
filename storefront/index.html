<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Amazon Picks</title>
<style>
 :root{color-scheme:light dark}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#e6edf3}
 header{padding:22px 18px 8px;text-align:center} header h1{margin:0;font-size:22px}
 .disc{font-size:11px;color:#8b949e;text-align:center;padding:0 18px 14px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:14px;max-width:920px;margin:0 auto}
 .card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .15s}
 .card:hover{border-color:#2f81f7}
 .imgwrap{height:170px;background:#fff;display:grid;place-items:center} .imgwrap img{max-width:100%;max-height:100%;object-fit:contain}
 .body{padding:11px;display:flex;flex-direction:column;gap:7px;flex:1}
 .cat{font:600 10px ui-monospace,monospace;color:#8b949e;text-transform:uppercase}
 .title{font-size:13px;line-height:1.3;font-weight:600}
 .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
 .price{font-weight:700} .btn{font-size:11px;color:#2f81f7;white-space:nowrap}
 .empty{text-align:center;color:#8b949e;padding:40px}
 footer{text-align:center;color:#8b949e;font-size:11px;padding:20px}
</style></head><body>
<header><h1>🛍️ Amazon Picks</h1></header>
<p class="disc">#Ad · As an Amazon Associate I earn from qualifying purchases.</p>
<div class="grid"><p class="empty">No products yet — post some from Business-SK.</p></div>
<footer>0 products · updated live</footer>
</body></html>
