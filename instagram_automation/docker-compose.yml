# ===========================================================================
# Instagram_Business — full stack (frontend + backend + PostgreSQL)
# ===========================================================================
#   frontend  : React/Vite built to static, served by nginx (host :3000)
#   backend   : FastAPI carousel generator + IG publisher   (host :8000)
#   db        : PostgreSQL 16                                (host :5433)
#
#   Start:  docker compose up -d --build
#   Logs :  docker compose logs -f backend
#   Stop :  docker compose down            (add -v to also wipe the DB volume)
# ===========================================================================
name: instagram_business

services:
  db:
    image: postgres:18-alpine
    container_name: instagram_business_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram
      POSTGRES_DB: instagram_business
    ports:
      # Host 5433 -> container 5432, so it never clashes with a local Postgres.
      - "5433:5432"
    volumes:
      # PG18 images store data in a major-version subdir; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram -d instagram_business"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: instagram_business_backend
    restart: unless-stopped
    env_file:
      - .env                       # OPENAI_API_KEY, hosting + legacy IG keys
    # Live-reload: app/ is bind-mounted, so uvicorn --reload picks up edits instantly.
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/app"]
    environment:
      DATABASE_URL: postgresql://instagram:instagram@db:5432/instagram_business
      LEGACY_SQLITE_DB: /app/legacy/posts.db
      BUSINESS_USE_DOCLING: "1"    # use Docling as primary extractor (heavy image)
    volumes:
      - ./app:/app/app             # live app code (edit -> `compose restart backend`)
      - docling_cache:/root/.cache # persist Docling/HF model downloads across restarts
      - ./business:/app/business   # agent charters, schema, benchmarks (docs)
      - ./data-business:/app/data-business   # source real-estate documents (input)
      - ./images:/app/images       # rendered previews (persist + visible on host)
      - ./config.json:/app/config.json   # live overlay/generation tuning
      - ./.ragskey:/app/.ragskey   # token-encryption key (must match posts.db)
      - ./posts.db:/app/legacy/posts.db:ro   # one-time SQLite -> Postgres source
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Live Vite dev server with hot-module-reload (HMR). Source is bind-mounted,
  # so any edit under frontend/src reflects in the browser instantly — no image
  # rebuild, no stale cache. (The production nginx build lives in frontend/Dockerfile
  # for later; run it with `docker compose -f docker-compose.yml -f docker-compose.prod.yml up`.)
  frontend:
    image: node:20-alpine
    container_name: instagram_business_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      # Vite dev proxy forwards /api and /cdn to the backend container.
      VITE_API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "1"   # reliable file-watching on Docker Desktop (Windows)
    volumes:
      - ./frontend:/app                       # live source (HMR)
      - frontend_node_modules:/app/node_modules  # keep deps out of the bind mount
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  docling_cache:
  frontend_node_modules:
