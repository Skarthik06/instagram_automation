# Serves the built SPA and proxies API + preview-image traffic to the backend
# container so the browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets (filenames change every build) -> cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached, so a new deploy is picked up immediately
    # (it references the latest hashed assets). Applies to the SPA fallback too.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
        try_files /index.html =404;
    }

    # SPA routing: fall back to index.html for client-side routes (no-store via above).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend (long-running generation calls -> generous timeouts).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Locally-rendered carousel previews (served by the backend's /cdn mount).
    location /cdn/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
